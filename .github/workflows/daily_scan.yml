name: Daily smart money scan (EU)

on:
  schedule:
    - cron: '5 21 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner + paper trading
        run: python scanner_job.py

      - name: Debug — vis filer før commit
        run: |
          echo "=== Working directory ==="
          pwd
          echo "=== Filer i data/ ==="
          ls -la data/
          echo "=== Innhold portfolio.json (første 30 linjer) ==="
          head -30 data/portfolio.json
          echo "=== Git status ==="
          git status
          echo "=== Git diff data/portfolio.json ==="
          git diff --stat data/portfolio.json || echo "(ingen diff)"

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Force-add begge filer, selv om Git tror de er uendret
          git add -A data/signals_state.json data/portfolio.json

          echo "=== Staged endringer ==="
          git diff --staged --stat

          if git diff --staged --quiet; then
            echo "Ingen endringer å commite — dette er rart!"
            echo "Dumping filinnhold for debugging:"
            cat data/portfolio.json | head -50
            exit 0
          fi

          git commit -m "chore: oppdater state $(date -u +'%Y-%m-%d %H:%M UTC')"

          MAX_RETRIES=5
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "=== Push-forsøk $attempt av $MAX_RETRIES ==="
            if git push origin main; then
              echo "✓ Push lyktes"
              exit 0
            fi
            git fetch origin main
            if git rebase origin/main; then
              echo "✓ Rebase lyktes"
            else
              git rebase --abort
              exit 1
            fi
            sleep 3
          done
          exit 1
