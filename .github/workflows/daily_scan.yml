name: Daily smart money scan (EU)

on:
  schedule:
    - cron: '5 21 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner
        run: python scanner_job.py

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/signals_state.json
          if git diff --staged --quiet; then
            echo "Ingen endringer å commite"
            exit 0
          fi
          git commit -m "chore: oppdater signal-state $(date -u +'%Y-%m-%d %H:%M UTC')"
          MAX_RETRIES=5
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "=== Push-forsøk $attempt av $MAX_RETRIES ==="
            if git push origin main; then
              echo "✓ Push lyktes"
              exit 0
            fi
            git fetch origin main
            if git rebase origin/main; then
              echo "✓ Rebase lyktes"
            else
              git rebase --abort
              exit 1
            fi
            sleep 3
          done
          exit 1
